<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>free-ai-gateway · 免费 API 目录</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2840;background:#f5f7fb}body{margin:0}main{max-width:1040px;margin:auto;padding:48px 24px}h1{font-size:36px;line-height:1.2}h2{font-size:20px;margin:0}p{line-height:1.7}.lead{max-width:720px;color:#53617a}a{color:#315fbc}nav{display:flex;gap:20px;flex-wrap:wrap;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.card{background:white;border:1px solid #dbe1ec;border-radius:14px;padding:24px}.tag{display:inline-block;border-radius:20px;background:#e3f5e9;color:#22623b;padding:4px 10px;font-size:12px}.trial{background:#fff0d5;color:#845510}code{overflow-wrap:anywhere;font-size:12px;color:#485873}.muted{color:#68758b;font-size:13px}button,input{font:inherit;border:1px solid #cdd6e6;border-radius:8px;padding:9px 12px;background:white}header{margin-bottom:28px}.filter{width:100%;box-sizing:border-box;margin:12px 0 24px}footer{margin-top:36px;border-top:1px solid #dbe1ec;padding-top:16px}
</style></head><body><main><header><span class="tag">个人 API 管理</span><h1>轻量、易用，把自己的 API 管起来。</h1><p class="lead">free-ai-gateway 提供 Mac 本机与 VPS 管理，目前侧重免费 API 聚合。接入助手读取这里的目录，结合内置软件手册提供配置指引。账号和密钥由你自己持有。</p><nav><a href="https://github.com/Emir-Aksoy/free-ai-gateway">GitHub 项目</a><a href="https://github.com/Emir-Aksoy/free-ai-gateway/releases/latest">下载 App</a><a href="https://github.com/Emir-Aksoy/free-ai-gateway/blob/master/docs/free-api-catalog.md">目录与接入步骤</a><a href="https://github.com/Emir-Aksoy/free-ai-gateway/blob/master/docs/free-api-catalog.en.md">English guide</a></nav></header><h2>免费 API 目录</h2><p class="muted" id="stamp">正在读取公开目录…</p><input class="filter" id="query" placeholder="筛选 Provider 或模型" aria-label="筛选 Provider 或模型"><div class="grid" id="catalog"></div><footer><p>免费额度不等于无限额度；试用赠金不等于持续免费。请先核实官方条款与账号资格，查询当前目录再测试。目录不包含私人调用统计。</p><p class="muted">发现新资源或政策变化？请在 GitHub Issue 提供官方来源与模型 ID，不提交密钥、账号截图或服务器地址。</p></footer></main><script>
let providers=[];const box=document.getElementById('catalog');
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function safeLink(url){try{const parsed=new URL(url);return parsed.protocol==='https:'&&!parsed.username&&!parsed.password;}catch{return false;}}
function render(){box.replaceChildren();const q=document.getElementById('query').value.toLowerCase();for(const p of providers.filter(p=>(p.title+' '+p.models.join(' ')).toLowerCase().includes(q))){const card=element('article','','card');card.append(element('h2',p.title),element('p',p.free_kind==='free_tier'?'免费额度':p.free_kind==='trial'?'限时试用 · 非持续免费':'待核查',p.free_kind==='free_tier'?'tag':'tag trial'),element('p',p.summary['zh-CN']),element('p',p.limits['zh-CN'],'muted'),element('code',p.base_url),element('p','模型示例：'+(p.models.join('、')||'请查询当前目录'),'muted'));for(const source of p.sources){if(safeLink(source.url)){const a=element('a',source.title+' ↗');a.href=source.url;a.target='_blank';a.rel='noreferrer';const line=element('p','');line.append(a);card.append(line);}}card.append(element('p','官方资料核查：'+p.checked_at,'muted'));box.append(card);}}
document.getElementById('query').addEventListener('input',render);
fetch('./free-api-catalog.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{if(data.schema!==1||!Array.isArray(data.providers))throw Error();providers=data.providers;document.getElementById('stamp').textContent='目录更新：'+data.updated_at+' UTC · 以官方资料和当前账号为准';render();}).catch(()=>{document.getElementById('stamp').textContent='目录暂时无法读取，请访问上方 GitHub 目录链接。';});
</script></body></html>

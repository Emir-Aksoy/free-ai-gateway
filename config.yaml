# Personal API gateway configuration. Edit with the App.
gateway:
  name: free-ai-gateway
  timezone: America/Los_Angeles
  routing:
    mode: manual
    use_latency: true
    use_success_rate: true
  modes:
    fast:
      - groq:qwen/qwen3.8-27b
      - groq:openai/gpt-oss-20b
      - groq:groq/compound
      - agnes:agnes-2.0-flash
      - gemini:gemini-flash-latest
    balanced:
      - groq:openai/gpt-oss-120b
      - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
      - gemini:gemini-flash-latest
      - agnes:agnes-2.5-flash
      - agnes:agnes-2.0-flash
    task:
      code:
        - groq:openai/gpt-oss-120b
        - agnes:agnes-2.5-pro
        - opencode:mimo-v2.5-free
        - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
        - gemini:gemini-3.5-flash
      writing:
        - agnes:agnes-2.5-pro
        - gemini:gemini-flash-latest
        - gemini:gemini-3.5-flash
        - groq:openai/gpt-oss-120b
        - agnes:agnes-2.5-flash
      agent:
        - groq:openai/gpt-oss-120b
        - agnes:agnes-2.5-pro
        - gemini:gemini-flash-latest
        - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
        - groq:groq/compound
    thinking:
      - openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
      - agnes:agnes-2.5-pro
      - openrouter:nvidia/nemotron-3.5-lightning:free
      - openrouter:minimax/minimax-m3:free
      - gemini:gemini-3.5-flash

providers:
  groq:
    env: /etc/groq.env

  gemini:
    env: /etc/gemini.env

  opencode:
    env: /etc/opencode.env

  agnes:
    env: /etc/agnes.env

  openrouter:
    env: /etc/openrouter.env

limits:
  request_timeout: 120

  state:
    max_days: 30

  logs:
    keep_days: 30

quota:
  groq:
    rpm: 25
    daily: 0

  gemini:
    rpm: 12
    daily: 0

  opencode:
    rpm: 20
    daily: 0

  agnes:
    rpm: 20
    daily: 0

  openrouter:
    rpm: 15
    daily: 0
